<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f4fd8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Kilit Servis</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--fg:#14182b;--mut:#6b7392;--line:#dfe3f0;--acc:#1f4fd8;--accfg:#fff;--red:#d92d4b;--amb:#d98a00;--grn:#12a05a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1020;--card:#171b33;--fg:#eaedff;--mut:#939bc2;--line:#292f58;--acc:#5b86ff;--accfg:#0d1020;--red:#ff5c78;--amb:#ffb13b;--grn:#3ddc8c}}
:root[data-theme="dark"]{--bg:#0d1020;--card:#171b33;--fg:#eaedff;--mut:#939bc2;--line:#292f58;--acc:#5b86ff;--accfg:#0d1020;--red:#ff5c78;--amb:#ffb13b;--grn:#3ddc8c}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:90px}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:14px 16px 8px}
h1{margin:0 0 10px;font-size:22px;display:flex;align-items:center;gap:8px}
.stat{margin-left:auto;font-size:12px;font-weight:600;color:var(--mut);display:flex;align-items:center;gap:5px}
.stat i{width:8px;height:8px;border-radius:50%;background:var(--amb);display:inline-block}
.stat.live i{background:var(--grn)}
.who{font-size:12px;color:var(--mut);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.st b{display:block;font-size:22px}.st span{font-size:12px;color:var(--mut)}
.tabs{display:flex;gap:6px;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:10px;border-radius:9px}
.tabs button.on{background:var(--acc);color:var(--accfg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 0}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:13px;padding:6px 12px;border-radius:99px}
.chip.on{background:var(--fg);color:var(--bg)}
.list{padding:10px 16px;display:grid;gap:10px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;border-left:5px solid var(--mut)}
.card.p-y{border-left-color:var(--red)}.card.p-o{border-left-color:var(--amb)}.card.p-d{border-left-color:var(--grn)}
.card.done{opacity:.6}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ttl{font-weight:700}.sub{color:var(--mut);font-size:13px;margin-top:2px}
.note{margin-top:6px;font-size:14px;white-space:pre-wrap}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--line);white-space:nowrap}
.b-a{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.b-w{background:color-mix(in srgb,var(--amb) 20%,transparent);color:var(--amb)}
.b-g{background:color-mix(in srgb,var(--grn) 20%,transparent);color:var(--grn)}
.act{display:flex;gap:8px;margin-top:10px}
.act button{flex:1;border:1px solid var(--line);background:none;color:var(--fg);font:inherit;font-size:13px;padding:8px;border-radius:9px}
.act .main{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
.act .del{flex:none;color:var(--red)}
.empty{text-align:center;color:var(--mut);padding:50px 20px}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--accfg);border:0;font:inherit;font-weight:700;font-size:16px;padding:15px 22px;border-radius:99px;box-shadow:0 6px 20px #0004}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:18px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px}
textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;margin-top:16px}
.btns button{flex:1;font:inherit;font-weight:600;padding:13px;border-radius:11px;border:1px solid var(--line);background:none;color:var(--fg)}
.btns .ok{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.login{display:none;min-height:80vh;align-items:center;justify-content:center;padding:20px}
body.out .login{display:flex}
.lbox{width:100%;max-width:360px;display:grid;gap:10px}
.lbox h2{margin:0}
.lbox button{font:inherit;font-weight:600;padding:13px;border-radius:11px;border:1px solid var(--line);background:none;color:var(--fg)}
.lbox .ok{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.lbox .lnk{border:0;color:var(--mut);font-weight:400}
body.out .top,body.out .chips,body.out .list,body.out .fab{display:none}
.lo{font:inherit;font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--mut)}
</style>
</head>
<body class="out">
<div class="top">
  <h1>🔑 Kilit Servis <small id="stat" class="stat"></small><button id="pw" class="lo">Şifre</button><button id="lo" class="lo">Çıkış</button></h1>
  <div class="stats">
    <div class="st"><b id="s1">0</b><span>Açık arıza</span></div>
    <div class="st"><b id="s2">0</b><span>Devam eden</span></div>
    <div class="st"><b id="s3">0</b><span>Geciken bakım</span></div>
  </div>
  <div class="tabs"><button id="tf" class="on">Arızalar</button><button id="tm">Bakım</button></div>
</div>
<div class="chips" id="chips"></div>
<div class="list" id="list"></div>
<button class="fab" id="fab">+ Yeni</button>

<div class="login" id="login"><div class="lbox"><h2>🔑 Emk Servis Takip Ekranı</h2><div id="lmsg" class="sub">Teknisyen girişi</div>
<input id="l_e" type="text" placeholder="Kullanıcı adı" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"><input id="l_p" type="password" placeholder="Şifre" autocomplete="current-password">
<button class="ok" id="l_go">Giriş yap</button></div></div>

<div class="modal" id="md"><div class="sheet" id="sh"></div></div>

<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";

/* 1) Supabase panelinden aldığın bilgileri buraya yapıştır (README adım 5) */
const SUPABASE_URL="https://PROJE_ID.supabase.co";
const SUPABASE_KEY="BURAYA_ANON_PUBLIC_KEY";   // sadece "anon public" anahtarı; service_role ASLA

/* Kullanıcı adı arka planda bu alan adıyla e-postaya çevrilir.
   Panelde kullanıcıyı kullaniciadi@emk-servis.app olarak ekle. */
const DOMAIN='emk-servis.app';
const toEmail=u=>u.trim().toLowerCase().replace(/\s+/g,'')+'@'+DOMAIN;
const configured=!SUPABASE_KEY.startsWith("BURAYA");
const sb=createClient(configured?SUPABASE_URL:'https://x.supabase.co',configured?SUPABASE_KEY:'x');
const FT=['Pil bitti / zayıf','Kart okumuyor','Kilit açılmıyor','Mekanik / kol-dil sorunu','Saat / yazılım hatası','Kapı kapanmıyor','Kart kodlama sorunu','Diğer'];
const MT=['Pil değişimi','Genel kontrol','Yazılım / firmware güncelleme','Temizlik ve yağlama','Okuyucu kontrolü','Diğer'];
const PR={y:'Yüksek',o:'Orta',d:'Düşük'};
const ST=['Açık','Devam ediyor','Çözüldü'];
const COL={f:'faults',m:'maint'};
let S={f:[],m:[]},tab='f',flt='all',kind='f',me=null,names={};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>new Date(d+'T00:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'short',year:'numeric'});
const fmtT=t=>new Date(t).toLocaleString('tr-TR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hotels=()=>[...new Set([...S.f,...S.m].map(x=>x.otel).filter(Boolean))];
const nm=id=>!id?'':(id==me?'Ben':(names[id]||'Teknisyen'));
function setStat(t,live){const e=$('#stat');e.className='stat'+(live?' live':'');e.innerHTML='<i></i>'+esc(t)}

function render(){
  $('#s1').textContent=S.f.filter(x=>x.st==0).length;
  $('#s2').textContent=S.f.filter(x=>x.st==1).length;
  $('#s3').textContent=S.m.filter(x=>!x.done&&x.tarih<today()).length;
  $('#tf').classList.toggle('on',tab=='f');$('#tm').classList.toggle('on',tab=='m');
  const opts=tab=='f'?[['all','Tümü'],['0','Açık'],['1','Devam ediyor'],['mine','Bende'],['2','Çözüldü']]:[['all','Tümü'],['late','Geciken'],['open','Bekleyen'],['done','Tamamlanan']];
  $('#chips').innerHTML=opts.map(o=>`<button class="chip ${flt==o[0]?'on':''}" data-f="${o[0]}">${o[1]}</button>`).join('');
  let h='';
  if(tab=='f'){
    const a=S.f.filter(x=>flt=='all'||(flt=='mine'?(x.who==me&&x.st==1):x.st==flt)).sort((a,b)=>(a.st==2)-(b.st==2)||'yod'.indexOf(a.pr)-'yod'.indexOf(b.pr)||b.t-a.t);
    h=a.map(x=>`<div class="card p-${x.pr} ${x.st==2?'done':''}"><div class="row"><div><div class="ttl">${esc(x.otel)} · Oda ${esc(x.oda)}</div><div class="sub">${esc(FT[x.tur])} · ${PR[x.pr]} öncelik · ${fmtT(x.t)}</div></div><span class="badge ${['b-a','b-w','b-g'][x.st]}">${ST[x.st]}</span></div>${x.not?`<div class="note">${esc(x.not)}</div>`:''}<div class="who">Açan: ${esc(nm(x.by)||'—')}${x.who?' · Üstlenen: '+esc(nm(x.who)):''}</div><div class="act">${x.st==0?`<button class="main" data-a="take" data-i="${x.id}">İşi üstlen</button>`:x.st==1?`<button class="main" data-a="res" data-i="${x.id}">Çözüldü yap</button>${x.who!=me?`<button data-a="take" data-i="${x.id}">Devral</button>`:''}`:`<button data-a="reopen" data-i="${x.id}">Yeniden aç</button>`}${x.by==me?`<button class="del" data-a="del" data-i="${x.id}">Sil</button>`:''}</div></div>`).join('');
  }else{
    const t=today();
    const a=S.m.filter(x=>flt=='all'||(flt=='late'&&!x.done&&x.tarih<t)||(flt=='open'&&!x.done)||(flt=='done'&&x.done)).sort((a,b)=>a.done-b.done||a.tarih.localeCompare(b.tarih));
    h=a.map(x=>{const late=!x.done&&x.tarih<t;return `<div class="card ${x.done?'p-d done':late?'p-y':'p-o'}"><div class="row"><div><div class="ttl">${esc(x.otel)}${x.kapsam?' · '+esc(x.kapsam):''}</div><div class="sub">${esc(MT[x.tur])} · ${fmt(x.tarih)}</div></div><span class="badge ${x.done?'b-g':late?'b-a':'b-w'}">${x.done?'Tamamlandı':late?'Gecikti':'Planlı'}</span></div>${x.not?`<div class="note">${esc(x.not)}</div>`:''}<div class="who">Planlayan: ${esc(nm(x.by)||'—')}${x.done&&x.doneBy?' · Yapan: '+esc(nm(x.doneBy)):''}</div><div class="act">${x.done?`<button data-a="undo" data-i="${x.id}">Geri al</button>`:`<button class="main" data-a="done" data-i="${x.id}">Tamamlandı</button>`}${x.by==me?`<button class="del" data-a="del" data-i="${x.id}">Sil</button>`:''}</div></div>`}).join('');
  }
  $('#list').innerHTML=h||`<div class="empty">${tab=='f'?'Kayıtlı arıza yok.<br>Sağ alttan yeni arıza ekle.':'Planlı bakım yok.<br>Sağ alttan bakım planla.'}</div>`;
}

function openForm(){
  kind=tab;
  const dl=`<datalist id="hl">${hotels().map(h=>`<option value="${esc(h)}">`).join('')}</datalist>`;
  $('#sh').innerHTML=kind=='f'?`<h2>Yeni arıza kaydı</h2>${dl}
    <label>Otel / müşteri</label><input id="i_otel" list="hl" placeholder="Otel adı">
    <div class="two"><div><label>Oda no</label><input id="i_oda" placeholder="204"></div>
    <div><label>Öncelik</label><select id="i_pr"><option value="y">Yüksek</option><option value="o" selected>Orta</option><option value="d">Düşük</option></select></div></div>
    <label>Arıza türü</label><select id="i_tur">${FT.map((t,i)=>`<option value="${i}">${t}</option>`).join('')}</select>
    <label>Not</label><textarea id="i_not" placeholder="Detay, yapılan işlem…"></textarea>
    <div class="btns"><button id="cx">Vazgeç</button><button class="ok" id="sv">Kaydet</button></div>`
  :`<h2>Bakım planla</h2>${dl}
    <label>Otel / müşteri</label><input id="i_otel" list="hl" placeholder="Otel adı">
    <div class="two"><div><label>Kapsam (kat/blok)</label><input id="i_kap" placeholder="3. kat"></div>
    <div><label>Tarih</label><input id="i_tar" type="date" value="${today()}"></div></div>
    <label>Bakım türü</label><select id="i_tur">${MT.map((t,i)=>`<option value="${i}">${t}</option>`).join('')}</select>
    <label>Not</label><textarea id="i_not" placeholder="Not…"></textarea>
    <div class="btns"><button id="cx">Vazgeç</button><button class="ok" id="sv">Kaydet</button></div>`;
  $('#md').classList.add('show');
  $('#cx').onclick=close;
  $('#sv').onclick=()=>{
    const otel=$('#i_otel').value.trim();if(!otel){$('#i_otel').focus();return}
    let o;
    if(kind=='f'){const oda=$('#i_oda').value.trim();if(!oda){$('#i_oda').focus();return}
      o={id:uid(),otel,oda,pr:$('#i_pr').value,tur:+$('#i_tur').value,not:$('#i_not').value.trim(),st:0,t:Date.now(),by:me,who:null}}
    else{const tarih=$('#i_tar').value;if(!tarih){$('#i_tar').focus();return}
      o={id:uid(),otel,kapsam:$('#i_kap').value.trim(),tarih,tur:+$('#i_tur').value,not:$('#i_not').value.trim(),done:false,by:me,doneBy:null}}
    store.put(kind,o).catch(fail);close();
  };
}
function close(){$('#md').classList.remove('show')}

const chk=async p=>{const {error}=await p;if(error)throw error};
const store={
  async put(k,o){S[k].push(o);render();try{await chk(sb.from('records').insert({id:o.id,kind:k,data:o,by_id:me}))}catch(e){S[k]=S[k].filter(x=>x.id!=o.id);render();throw e}},
  async upd(k,id,p){const o=S[k].find(x=>x.id==id);if(!o)return;const old={...o};Object.assign(o,p);render();try{await chk(sb.from('records').update({data:{...o}}).eq('id',id))}catch(e){Object.assign(o,old);render();throw e}},
  async del(k,id){const old=S[k];S[k]=old.filter(x=>x.id!=id);render();try{await chk(sb.from('records').delete().eq('id',id))}catch(e){S[k]=old;render();throw e}}
};
const fail=()=>alert('İşlem yapılamadı. İnternet bağlantını kontrol et ya da bu işlem için yetkin olmayabilir.');

$('#fab').onclick=openForm;
$('#md').onclick=e=>{if(e.target.id=='md')close()};
$('#tf').onclick=()=>{tab='f';flt='all';render()};
$('#tm').onclick=()=>{tab='m';flt='all';render()};
$('#chips').onclick=e=>{const b=e.target.closest('[data-f]');if(b){flt=b.dataset.f;render()}};
$('#list').onclick=e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const id=b.dataset.i,a=b.dataset.a,now=Date.now();let p;
  if(a=='take')p=store.upd('f',id,{st:1,who:me,u:now});
  else if(a=='res')p=store.upd('f',id,{st:2,u:now});
  else if(a=='reopen')p=store.upd('f',id,{st:0,who:null,u:now});
  else if(a=='done')p=store.upd('m',id,{done:true,doneBy:me});
  else if(a=='undo')p=store.upd('m',id,{done:false,doneBy:null});
  else if(a=='del'){if(!confirm('Bu kayıt silinsin mi?'))return;p=store.del(S.f.some(x=>x.id==id)?'f':'m',id)}
  p&&p.catch(fail);
};

/* ---- Veri çekme ve canlı senkronizasyon ---- */
let chan=null,poll=null,timer=null,live=false;
const saveCache=()=>{try{localStorage.setItem('ks_cache',JSON.stringify({S,names}))}catch(e){}};
async function load(){
  if(!me)return;
  try{
    const [r,p]=await Promise.all([sb.from('records').select('id,kind,data,by_id'),sb.from('profiles').select('id,name')]);
    if(r.error)throw r.error;
    S={f:[],m:[]};r.data.forEach(x=>S[x.kind]&&S[x.kind].push({...x.data,id:x.id,by:x.by_id}));
    if(!p.error){names={};p.data.forEach(x=>names[x.id]=x.name)}
    saveCache();setStat(live?'Canlı':'Bağlı',true);render();
  }catch(e){setStat('Çevrimdışı — son kayıtlar gösteriliyor')}
}
function stopSync(){if(chan){sb.removeChannel(chan);chan=null}clearInterval(poll);clearTimeout(timer);live=false}
function startSync(){
  stopSync();
  const kick=()=>{clearTimeout(timer);timer=setTimeout(load,250)};
  chan=sb.channel('ks')
    .on('postgres_changes',{event:'*',schema:'public',table:'records'},kick)
    .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},kick)
    .subscribe(s=>{live=s=='SUBSCRIBED';if(live)load();else if(s!='CLOSED')setStat('Bağlantı bekleniyor…')});
  poll=setInterval(load,30000);
  load();
}
async function init(u){
  document.body.classList.remove('out');setStat('Bağlanıyor…');
  try{const c=JSON.parse(localStorage.getItem('ks_cache'));if(c){S=c.S;names=c.names;render()}}catch(e){}
  try{
    const r=await sb.from('profiles').select('id').eq('id',u.id).maybeSingle();
    if(!r.error&&!r.data){let n='';while(!n)n=(prompt('Adın ve soyadın? (ekipte bu isimle görüneceksin)')||'').trim();await sb.from('profiles').upsert({id:u.id,name:n})}
  }catch(e){}
  startSync();render();
}

/* ---- Giriş ---- */
sb.auth.onAuthStateChange((ev,session)=>{
  const u=session&&session.user;
  if(!u){stopSync();me=null;S={f:[],m:[]};document.body.classList.add('out');setStat('');render();return}
  if(me==u.id)return;
  me=u.id;setTimeout(()=>init(u),0);
});
const msg=t=>$('#lmsg').textContent=t;
if(!configured)msg('Kurulum eksik: index.html içindeki SUPABASE_KEY doldurulmamış.');
$('#l_go').onclick=async()=>{
  if(!configured)return;
  msg('Giriş yapılıyor…');
  const {error}=await sb.auth.signInWithPassword({email:toEmail($('#l_e').value),password:$('#l_p').value});
  if(error)msg(/fetch|network/i.test(error.message)?'Bağlantı kurulamadı. İnterneti kontrol et.':'Kullanıcı adı veya şifre hatalı.');
};
$('#l_p').onkeydown=e=>{if(e.key=='Enter')$('#l_go').click()};
$('#lo').onclick=()=>{if(confirm('Çıkış yapılsın mı?'))sb.auth.signOut()};
$('#pw').onclick=async()=>{
  const p=prompt('Yeni şifre (en az 6 karakter):');if(!p)return;
  const {error}=await sb.auth.updateUser({password:p});
  alert(error?'Şifre değiştirilemedi: '+error.message:'Şifren değiştirildi.');
};
window.addEventListener('offline',()=>{live=false;setStat('Çevrimdışı — değişiklik yapılamaz')});
window.addEventListener('online',()=>{setStat('Bağlanıyor…');load()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
